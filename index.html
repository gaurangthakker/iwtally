<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outward Freight Register - Premium Dark Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0b0f19; 
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="p-3 md:p-8 text-slate-100 min-h-screen antialiased selection:bg-blue-600 selection:text-white">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="bg-gradient-to-b from-slate-900 to-gray-950 p-5 md:p-6 rounded-2xl border border-slate-800 shadow-2xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-5">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-3xl">📊</span>
                    <h1 class="text-xl md:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        Outward Freight Register <span class="text-xs font-mono px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-widest">RR Based</span>
                    </h1>
                </div>
                <p class="text-xs text-slate-400 mt-1 pl-1 flex items-center gap-1">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Designed & Developed by <span class="text-slate-200 font-medium">Gaurang Thakker, CGS-HAPA</span>
                </p>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
                <div class="relative w-full sm:w-auto group">
                    <input type="file" id="csvFileInput" onchange="loadFreightData()" accept=".csv, text/csv, application/vnd.ms-excel, application/csv" 
                            class="block w-full text-xs text-slate-400 
                            file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border file:border-slate-700
                            file:text-xs file:font-bold file:bg-slate-900 file:text-slate-250 
                            hover:file:bg-slate-800 file:transition-all file:cursor-pointer
                            border border-slate-800 rounded-xl p-1 bg-slate-950/60 focus:outline-none" />
                </div>
                <button id="exportBtn" onclick="exportToExcel()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl transition-all cursor-pointer text-xs tracking-wide shadow-lg shadow-emerald-600/10 hover:shadow-emerald-600/20 hidden flex items-center justify-center gap-2 active:scale-98">
                    <span>🟢</span> Export Filtered to Excel
                </button>
            </div>
        </div>

        <div id="tableContainer" class="bg-gray-950 rounded-2xl border border-slate-800 shadow-2xl overflow-hidden hidden flex flex-col">
            
            <div class="p-4 border-b border-slate-850 bg-slate-900/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center gap-2.5">
                    <span class="flex h-2.5 w-2.5 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span>
                    </span>
                    <span class="font-bold text-slate-200 text-sm tracking-wide">
                        📋 Records Monitor: <span id="liveRowCount" class="text-blue-400 font-mono text-base ml-1">0</span> Rows Found
                    </span>
                </div>
                <div class="relative w-full sm:w-80">
                    <input type="text" id="tableSearchInput" onkeyup="filterFreightTable()" placeholder="Station, RR ya Commodity se filter karein..." 
                           class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 transition-all shadow-inner" />
                </div>
            </div>

            <div class="overflow-x-auto max-h-[600px] custom-scrollbar">
                <table class="w-full text-left border-collapse min-w-[1200px]" id="freightTable">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-400 uppercase text-[10px] font-bold tracking-widest sticky top-0 border-b border-slate-800 z-10 backdrop-blur-md">
                            <th class="p-3.5 pl-6 text-center w-20">Sr. No.</th>
                            <th class="p-3.5">To Stn.</th>
                            <th class="p-3.5">RR Number</th>
                            <th class="p-3.5">RR Date</th>
                            <th class="p-3.5 text-center">L/F</th>
                            <th class="p-3.5">INV. NO.</th>
                            <th class="p-3.5 text-center">WGN.</th>
                            <th class="p-3.5 text-right">CWT</th>
                            <th class="p-3.5 text-right">BASIC FREIGHT Rs.</th>
                            <th class="p-3.5 text-right">GST Amt. Rs.</th>
                            <th class="p-3.5 pr-6">COMMODITY</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-900 text-xs text-slate-300" id="freightTableBody">
                    </tbody>
                    <tfoot class="bg-slate-900 font-bold border-t-2 border-slate-800 text-slate-100 sticky bottom-0 z-10 shadow-[0_-4px_10px_rgba(0,0,0,0.3)]" id="freightTableFoot">
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        let globalProcessedData = []; 

        function loadFreightData() {
            const fileInput = document.getElementById('csvFileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Kripya pehle apni Outward Freight Register CSV file select karein.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                parseAndRenderCSV(e.target.result);
                // 💡 File read hone ke baad input reset kiya taaki mobile memory release ho jaye aur dubara click chale
                fileInput.value = ''; 
            };
            reader.readAsText(file);
        }

        function safeSplitCSV(line) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseDateString(dateStr) {
            if (!dateStr) return new Date(0);
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
            return new Date(dateStr);
        }

        function parseAndRenderCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            if (lines.length < 4) return;

            const headers = safeSplitCSV(lines[2]);
            
            const toIdx = headers.indexOf('STATION TO');
            const rrIdx = headers.indexOf('RR NUMBER');
            const dateIdx = headers.indexOf('RR DATE');
            const lfIdx = headers.indexOf('F/L/I FLAG');
            const invNoIdx = headers.indexOf('INVOICE NO.');
            const wgnIdx = headers.indexOf('8-WHLR');
            const cwtIdx = headers.indexOf('WEIGHT CHRG');
            const basicIdx = headers.indexOf('TOTAL FRGT'); 
            const gstIdx = headers.indexOf('GST DETAILS TOTL GST');
            const cnsrIdx = headers.indexOf('CNSR CODE');
            const cnsgIdx = headers.indexOf('CNSG CODE');
            const wagonTypeIdx = headers.indexOf('WAGON TYPE');
            const cmdtIdx = headers.indexOf('CMDT CODE-CODE');
            const fromIdx = headers.indexOf('STATION FROM');

            let tempRawRows = [];

            for (let i = 3; i < lines.length; i++) {
                if (!lines[i].trim()) continue;

                const row = safeSplitCSV(lines[i]);
                if (row[fromIdx] === 'TOTAL' || row[0] === '' || !row[rrIdx]) continue;

                const rrDateStr = row[dateIdx] || '';
                const cnsrCode = (row[cnsrIdx] || '').toUpperCase();
                const cnsgCode = (row[cnsgIdx] || '').toUpperCase();
                const wagonType = (row[wagonTypeIdx] || '').toUpperCase();
                const originalCmdt = row[cmdtIdx] ? row[cmdtIdx].replace(/"/g, '') : '';

                let finalCommodity = originalCmdt;
                if (cnsrCode.includes('RAIL') || cnsgCode.includes('RAIL')) {
                    finalCommodity = 'RMC';
                } else if (wagonType.includes('TANK WAGON')) {
                    finalCommodity = 'EMPTY HAULAGE (BTPN)';
                } else if (wagonType.includes('FLAT WAGON')) {
                    finalCommodity = 'EMPTY CONTAINER';
                }

                tempRawRows.push({
                    toStn: row[toIdx] || '',
                    rrNum: row[rrIdx] || '',
                    rrDate: rrDateStr,
                    dateObj: parseDateString(rrDateStr),
                    lfFlag: row[lfIdx] || '',
                    invNo: row[invNoIdx] || '', 
                    wgn: parseInt(row[wgnIdx]) || 0, 
                    cwt: parseFloat(row[cwtIdx]) || 0,
                    basicFreight: parseFloat(row[basicIdx]) || 0,
                    gstAmt: parseFloat(row[gstIdx]) || 0,
                    commodity: finalCommodity
                });
            }

            tempRawRows.sort((a, b) => a.dateObj - b.dateObj);
            globalProcessedData = tempRawRows; 

            let tableHtml = '';
            let srNo = 1;

            tempRawRows.forEach(item => {
                tableHtml += `
                    <tr class="hover:bg-slate-900/60 transition-colors border-b border-slate-900/40" 
                        data-to="${item.toStn}" 
                        data-rr="${item.rrNum}" 
                        data-date="${item.rrDate}" 
                        data-lf="${item.lfFlag}" 
                        data-inv="${item.invNo}"
                        data-wgn="${item.wgn}"
                        data-cwt="${item.cwt}" 
                        data-basic="${item.basicFreight}" 
                        data-gst="${item.gstAmt}" 
                        data-commodity="${item.commodity}">
                        <td class="p-3 pl-6 text-center font-medium text-slate-500 font-mono src-no">${srNo}</td>
                        <td class="p-3 font-bold text-slate-200">${item.toStn}</td>
                        <td class="p-3 font-mono text-slate-400 tracking-wide">${item.rrNum}</td>
                        <td class="p-3 text-slate-400 font-mono text-[11px] whitespace-nowrap">${item.rrDate}</td>
                        <td class="p-3 text-center"><span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">${item.lfFlag}</span></td>
                        <td class="p-3 font-mono text-slate-400">${item.invNo}</td>
                        <td class="p-3 text-center font-mono text-slate-300">${item.wgn}</td>
                        <td class="p-3 text-right font-mono text-slate-300">${item.cwt.toFixed(2)}</td>
                        <td class="p-3 text-right font-mono text-blue-400 font-semibold">₹${item.basicFreight.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                        <td class="p-3 text-right font-mono text-emerald-400">₹${item.gstAmt.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                        <td class="p-3 pr-6 font-semibold text-sky-400 tracking-wide">${item.commodity}</td>
                    </tr>
                `;
                srNo++;
            });

            document.getElementById('freightTableBody').innerHTML = tableHtml;
            calculateLiveTotals();

            document.getElementById('tableContainer').classList.remove('hidden');
            document.getElementById('exportBtn').classList.remove('hidden');
        }

        function calculateLiveTotals() {
            const tbody = document.getElementById("freightTableBody");
            const rows = tbody.getElementsByTagName("tr");
            
            let visibleWgnSum = 0;
            let visibleCwtSum = 0;
            let visibleBasicSum = 0;
            let visibleGstSum = 0;
            let visibleCount = 0;

            let commoditySummary = {};

            for (let i = 0; i < rows.length; i++) {
                if (rows[i].style.display !== "none") {
                    const currentWgn = parseInt(rows[i].getAttribute("data-wgn")) || 0;
                    const currentCwt = parseFloat(rows[i].getAttribute("data-cwt")) || 0;
                    const currentBasic = parseFloat(rows[i].getAttribute("data-basic")) || 0;
                    const currentGst = parseFloat(rows[i].getAttribute("data-gst")) || 0;
                    const currentCmdt = rows[i].getAttribute("data-commodity") || "UNKNOWN";

                    visibleWgnSum += currentWgn;
                    visibleCwtSum += currentCwt;
                    visibleBasicSum += currentBasic;
                    visibleGstSum += currentGst;
                    
                    visibleCount++;
                    rows[i].querySelector(".src-no").innerText = visibleCount;

                    if (!commoditySummary[currentCmdt]) {
                        commoditySummary[currentCmdt] = { wgn: 0, cwt: 0, basic: 0, gst: 0 };
                    }
                    commoditySummary[currentCmdt].wgn += currentWgn;
                    commoditySummary[currentCmdt].cwt += currentCwt;
                    commoditySummary[currentCmdt].basic += currentBasic;
                    commoditySummary[currentCmdt].gst += currentGst;
                }
            }

            // 1. Grand Total Row
            let footerHtml = `
                <tr class="bg-slate-900 text-slate-200 text-xs font-bold border-t-2 border-slate-800">
                    <td class="p-4 pl-6 text-center tracking-wider bg-slate-850/80 text-blue-400 font-extrabold text-[11px]">GRAND TOTAL</td>
                    <td class="p-4"></td>
                    <td class="p-4"></td>
                    <td class="p-4"></td>
                    <td class="p-4 text-center"></td>
                    <td class="p-4"></td>
                    <td class="p-4 text-center font-mono text-slate-200 text-sm">${visibleWgnSum}</td>
                    <td class="p-4 text-right font-mono text-slate-200">${visibleCwtSum.toFixed(2)}</td>
                    <td class="p-4 text-right font-mono text-blue-400 text-sm">₹${visibleBasicSum.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                    <td class="p-4 text-right font-mono text-emerald-400 text-sm">₹${visibleGstSum.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                    <td class="p-4 pr-6 text-slate-400 font-normal italic text-[11px]">(${visibleCount} Matches Selected)</td>
                </tr>
            `;

            // 2. Commodity Summary Rows
            Object.keys(commoditySummary).sort().forEach(cmdt => {
                const summary = commoditySummary[cmdt];
                footerHtml += `
                    <tr class="bg-slate-950/40 text-slate-400 text-xs font-semibold border-t border-slate-900/60">
                        <td class="p-3 pl-6 text-center font-mono text-[10px] text-slate-600">---</td>
                        <td class="p-3 text-slate-500 font-mono text-[11px]">---</td>
                        <td class="p-3 font-mono text-slate-500">---</td>
                        <td class="p-3 text-slate-500 font-mono text-[11px]">---</td>
                        <td class="p-3 text-center text-slate-500">---</td>
                        <td class="p-3 text-slate-500 font-mono">---</td>
                        <td class="p-3 text-center font-mono text-amber-500/90">${summary.wgn}</td>
                        <td class="p-3 text-right font-mono text-slate-400">${summary.cwt.toFixed(2)}</td>
                        <td class="p-3 text-right font-mono text-blue-500/90">₹${summary.basic.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                        <td class="p-3 text-right font-mono text-emerald-500/90">₹${summary.gst.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                        <td class="p-3 pr-6 font-bold text-sky-500 tracking-wide bg-slate-900/20">${cmdt} TOTAL</td>
                    </tr>
                `;
            });

            document.getElementById('freightTableFoot').innerHTML = footerHtml;
            document.getElementById('liveRowCount').innerText = visibleCount;
        }

        function filterFreightTable() {
            const input = document.getElementById("tableSearchInput");
            const filter = input.value.toUpperCase();
            const tbody = document.getElementById("freightTableBody");
            const tr = tbody.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                let matchFound = false;
                const tds = tr[i].getElementsByTagName("td");
                
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j] && tds[j].textContent.toUpperCase().indexOf(filter) > -1) {
                        matchFound = true;
                        break;
                    }
                }
                tr[i].style.display = matchFound ? "" : "none";
            }

            calculateLiveTotals();
        }

        function exportToExcel() {
            const tbody = document.getElementById("freightTableBody");
            const rows = tbody.getElementsByTagName("tr");
            
            let excelRows = [];
            let sumWgn = 0, sumCwt = 0, sumBasic = 0, sumGst = 0;
            let currentSrNo = 1;
            let commoditySummary = {};

            for (let i = 0; i < rows.length; i++) {
                if (rows[i].style.display !== "none") {
                    const wgnVal = parseInt(rows[i].getAttribute("data-wgn")) || 0;
                    const cwtVal = parseFloat(rows[i].getAttribute("data-cwt")) || 0;
                    const basicVal = parseFloat(rows[i].getAttribute("data-basic")) || 0;
                    const gstVal = parseFloat(rows[i].getAttribute("data-gst")) || 0;
                    const cmdtVal = rows[i].getAttribute("data-commodity") || "UNKNOWN";

                    sumWgn += wgnVal;
                    sumCwt += cwtVal;
                    sumBasic += basicVal;
                    sumGst += gstVal;

                    if (!commoditySummary[cmdtVal]) {
                        commoditySummary[cmdtVal] = { wgn: 0, cwt: 0, basic: 0, gst: 0 };
                    }
                    commoditySummary[cmdtVal].wgn += wgnVal;
                    commoditySummary[cmdtVal].cwt += cwtVal;
                    commoditySummary[cmdtVal].basic += basicVal;
                    commoditySummary[cmdtVal].gst += gstVal;

                    excelRows.push({
                        "Sr. No.": currentSrNo,
                        "To Stn.": rows[i].getAttribute("data-to"),
                        "RR Number": rows[i].getAttribute("data-rr"),
                        "RR Date": rows[i].getAttribute("data-date"),
                        "L/F": rows[i].getAttribute("data-lf"),
                        "INV. NO.": rows[i].getAttribute("data-inv"), 
                        "WGN.": wgnVal,
                        "CWT": cwtVal,
                        "BASIC FREIGHT Rs.": basicVal,
                        "GST Amt. Rs.": gstVal,
                        "COMMODITY": cmdtVal
                    });
                    currentSrNo++;
                }
            }

            if (excelRows.length === 0) {
                alert('Export karne ke liye koi record nahi hai!');
                return;
            }

            excelRows.push({
                "Sr. No.": "GRAND TOTAL",
                "To Stn.": "",
                "RR Number": "",
                "RR Date": "",
                "L/F": "",
                "INV. NO.": "",
                "WGN.": sumWgn,
                "CWT": sumCwt,
                "BASIC FREIGHT Rs.": sumBasic,
                "GST Amt. Rs.": sumGst,
                "COMMODITY": `(${excelRows.length} Rows Exported)`
            });

            Object.keys(commoditySummary).sort().forEach(cmdt => {
                const summary = commoditySummary[cmdt];
                excelRows.push({
                    "Sr. No.": "---",
                    "To Stn.": "---",
                    "RR Number": "---",
                    "RR Date": "---",
                    "L/F": "---",
                    "INV. NO.": "---",
                    "WGN.": summary.wgn,
                    "CWT": summary.cwt,
                    "BASIC FREIGHT Rs.": summary.basic,
                    "GST Amt. Rs.": summary.gst,
                    "COMMODITY": `${cmdt} TOTAL`
                });
            });

            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Filtered Report");

            worksheet["!cols"] = [
                { wch: 14 }, { wch: 12 }, { wch: 15 }, { wch: 15 }, { wch: 8 }, 
                { wch: 15 }, { wch: 10 }, { wch: 12 }, { wch: 20 }, { wch: 15 }, { wch: 30 }
            ];

            XLSX.writeFile(workbook, "Filtered_Freight_Report.xlsx");
        }
    </script>
</body>
</html>
